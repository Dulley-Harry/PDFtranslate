name: Zotero adapter

on:
  workflow_dispatch:
  push:
    paths:
      - "adapters/zotero/**"
      - "scripts/build_zotero_xpi.py"
      - ".github/workflows/zotero.yml"
  pull_request:
    paths:
      - "adapters/zotero/**"
      - "scripts/build_zotero_xpi.py"
      - ".github/workflows/zotero.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build XPI
        run: python scripts/build_zotero_xpi.py
      - name: Upload development plugin
        uses: actions/upload-artifact@v4
        with:
          name: PDFtranslate-zotero
          path: dist/PDFtranslate-zotero.xpi
          if-no-files-found: error
