[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdftranslate"
version = "0.0.1"
description = "Universal local PDF translation bridge with a Codex CLI backend"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Dulley-Harry" }
]
dependencies = []

[project.scripts]
pdftranslate-codex = "pdftranslate.codex_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pdftranslate"]
